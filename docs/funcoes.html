<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Referência de todas as funções da Borg JS, com exemplos editáveis." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />
    <link rel="stylesheet" href="./css/estilo.css" />
    <script>
      try {
        const tema = localStorage.getItem('borg-tema')
        if (tema) document.documentElement.dataset.theme = tema
      } catch {}
    </script>
    <title>Funções · Borg JS</title>
  </head>
  <body data-pagina="funcoes">
    <header id="topo"></header>
    <main id="conteudo"></main>

    <script type="module" src="./js/paginas/funcoes.js"></script>
  </body>
</html>
